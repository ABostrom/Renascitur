[project]
name = "renasci"
version = "0.1.0"
description = "The Renascitur History Engine: a deterministic world-history simulator."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<2.6",  # draws are part of the engine version; golden tests guard upgrades
]

[project.scripts]
renasci = "renasci.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renasci", "src/renasci_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
